seed: 42
experiment_name: deeplabv3plus_base
output_dir: artifacts/experiments

system:
  device: cuda
  num_workers: 4
  amp: true

model:
  architecture: deeplabv3plus
  backbone: resnet50
  backbone_pretrained: true
  num_classes: 21
  low_level_index: 0
  high_level_index: -1
  aspp_out_channels: 256
  decoder_channels: 256
  dropout: 0.1

dataset:
  root_dir: data/VOCdevkit/VOC2012
  image_dir: JPEGImages
  mask_dir: SegmentationClass
  split_dir: ImageSets/Segmentation
  train_split: train.txt
  val_split: val.txt
  image_size: 512
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  ignore_index: 255

train:
  epochs: 40
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  grad_clip_norm: 1.0
  save_best_by: miou
  print_freq: 20

loss:
  name: cross_entropy

augmentation:
  horizontal_flip_prob: 0.5
  random_scale_min: 0.5
  random_scale_max: 2.0
  random_crop_size: 512

evaluation:
  save_predictions: true
  num_visualizations: 8
