<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Group13 | DL for CV</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap");

    :root {
      --bg: #f4f2eb;
      --bg-accent: #e9e3d8;
      --text: #1c2118;
      --muted: #5f6a56;
      --panel: rgba(255, 255, 255, 0.62);
      --line: rgba(37, 53, 23, 0.14);
      --brand: #1f6f4a;
      --brand-strong: #164f35;
      --gold: #c58f2d;
      --radius: 18px;
      --shadow: 0 16px 45px rgba(17, 35, 24, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: "Be Vietnam Pro", sans-serif;
      background:
        radial-gradient(900px 420px at 120% -10%, rgba(31, 111, 74, 0.23), transparent 60%),
        radial-gradient(600px 350px at -10% 0%, rgba(197, 143, 45, 0.2), transparent 62%),
        linear-gradient(140deg, var(--bg) 0%, #f9f7f2 50%, var(--bg-accent) 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 999px;
      pointer-events: none;
      z-index: 0;
      filter: blur(2px);
    }

    body::before {
      width: 290px;
      height: 290px;
      right: -90px;
      top: 26%;
      background: linear-gradient(180deg, rgba(31, 111, 74, 0.22), rgba(31, 111, 74, 0.02));
      animation: floatA 9s ease-in-out infinite;
    }

    body::after {
      width: 190px;
      height: 190px;
      left: -60px;
      bottom: 7%;
      background: linear-gradient(180deg, rgba(197, 143, 45, 0.19), rgba(197, 143, 45, 0.03));
      animation: floatB 11s ease-in-out infinite;
    }

    @keyframes floatA {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    @keyframes floatB {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(14px); }
    }

    .layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(260px, 300px) 1fr;
      min-height: 100vh;
      gap: 18px;
      padding: 22px;
    }

    .menu {
      align-self: start;
      position: sticky;
      top: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .menu-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.1rem;
      margin: 0 0 4px;
      letter-spacing: 0.03em;
    }

    .menu-subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .menu-button,
    .assignment-button,
    .expand-button,
    .task-button {
      border: 1px solid transparent;
      background: transparent;
      color: inherit;
      width: 100%;
      text-align: left;
      font: inherit;
      cursor: pointer;
      border-radius: 12px;
      transition: 0.22s ease;
    }

    .menu-button {
      padding: 12px;
      margin-bottom: 12px;
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.45);
      font-weight: 600;
    }

    .menu-button:hover,
    .menu-button.active {
      background: linear-gradient(120deg, rgba(31, 111, 74, 0.11), rgba(197, 143, 45, 0.11));
      border-color: rgba(31, 111, 74, 0.35);
      transform: translateX(2px);
    }

    .assignment-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 8px;
    }

    .assignment-button {
      border: 1px solid var(--line);
      padding: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.45);
    }

    .assignment-button:hover,
    .assignment-button.active {
      border-color: rgba(31, 111, 74, 0.35);
      background: linear-gradient(120deg, rgba(31, 111, 74, 0.11), rgba(197, 143, 45, 0.11));
      transform: translateX(2px);
    }

    .expand-button {
      width: 42px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.45);
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      color: var(--brand-strong);
    }

    .expand-button:hover,
    .expand-button.active {
      background: rgba(31, 111, 74, 0.12);
      border-color: rgba(31, 111, 74, 0.35);
    }

    .tasks {
      display: grid;
      gap: 7px;
      padding: 4px 0 0 8px;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.36s ease, opacity 0.26s ease;
    }

    .tasks.open {
      max-height: 220px;
      opacity: 1;
    }

    .task-button {
      padding: 10px;
      border: 1px dashed rgba(31, 111, 74, 0.3);
      background: rgba(255, 255, 255, 0.35);
      color: var(--brand-strong);
      font-size: 0.94rem;
      font-weight: 500;
    }

    .task-button:hover,
    .task-button.active {
      background: rgba(31, 111, 74, 0.16);
      border-style: solid;
    }

    .content {
      min-width: 0;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
      padding: clamp(20px, 3vw, 36px);
      animation: fadeInUp 0.55s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.77rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--brand-strong);
      background: rgba(31, 111, 74, 0.13);
      border: 1px solid rgba(31, 111, 74, 0.2);
      padding: 5px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 12px;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(1.5rem, 2.7vw, 2.2rem);
      letter-spacing: -0.01em;
      line-height: 1.15;
    }

    .lead {
      margin: 0 0 16px;
      color: var(--muted);
      max-width: 80ch;
      line-height: 1.62;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin: 18px 0;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.48);
      transform: translateY(6px);
      opacity: 0;
      animation: itemReveal 0.45s forwards;
    }

    .card:nth-child(1) { animation-delay: 0.03s; }
    .card:nth-child(2) { animation-delay: 0.11s; }
    .card:nth-child(3) { animation-delay: 0.19s; }
    .card:nth-child(4) { animation-delay: 0.27s; }

    @keyframes itemReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card h3 {
      margin: 0 0 6px;
      font-size: 1rem;
      color: var(--brand-strong);
    }

    .card p {
      margin: 0;
      color: #43503b;
      line-height: 1.54;
    }

    .section-title {
      margin: 18px 0 10px;
      font-size: 1rem;
      letter-spacing: 0.02em;
      color: var(--brand-strong);
    }

    ul {
      margin: 0;
      padding-left: 20px;
    }

    li {
      margin: 7px 0;
      line-height: 1.5;
    }

    .code-list {
      background: #101812;
      color: #edf8e9;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 14px;
      overflow-x: auto;
    }

    .code-list code {
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.88rem;
      white-space: pre;
      line-height: 1.5;
      margin: 2px 0;
    }

    .visuals {
      display: grid;
      gap: 12px;
      margin-top: 14px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    figure {
      margin: 0;
      background: rgba(255, 255, 255, 0.56);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
    }

    figure img {
      width: 100%;
      border-radius: 10px;
      display: block;
      aspect-ratio: 16 / 10;
      object-fit: cover;
    }

    figcaption {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .report-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(120deg, var(--brand), var(--brand-strong));
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 9px 13px;
      border-radius: 999px;
      font-weight: 600;
      margin-top: 8px;
      transition: transform 0.2s ease;
    }

    .resource-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .report-link:hover {
      transform: translateY(-2px);
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .menu {
        position: static;
      }

      .content {
        padding: 20px;
      }
    }

    /* ── Markdown rendered content ── */
    .md-content { line-height: 1.65; }
    .md-content h1 { font-family: "Space Grotesk", sans-serif; font-size: 1.5rem; color: var(--brand-strong); margin: 8px 0 14px; }
    .md-content h2 { font-family: "Space Grotesk", sans-serif; font-size: 1.15rem; color: var(--brand-strong); margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    .md-content h3 { font-size: 1rem; font-weight: 700; color: var(--brand-strong); margin: 18px 0 7px; }
    .md-content h4 { font-size: 0.95rem; color: var(--muted); margin: 12px 0 5px; font-weight: 600; }
    .md-content p { margin: 0 0 10px; }
    .md-content pre { background: #101812; color: #edf8e9; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); padding: 12px 16px; overflow-x: auto; margin: 10px 0; }
    .md-content pre code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.87rem; line-height: 1.5; background: none; padding: 0; border-radius: 0; }
    .md-content code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.88rem; background: rgba(31,111,74,0.1); padding: 2px 6px; border-radius: 4px; }
    .md-content table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.93rem; }
    .md-content th, .md-content td { padding: 7px 11px; border: 1px solid var(--line); text-align: left; }
    .md-content th { background: rgba(31,111,74,0.08); font-weight: 600; color: var(--brand-strong); }
    .md-content tr:nth-child(even) td { background: rgba(255,255,255,0.3); }
    .md-content img { max-width: 70%; border-radius: 10px; margin: 8px 0; display: block; }
    .md-content blockquote { border-left: 3px solid var(--brand); padding: 5px 14px; margin: 10px 0; color: var(--muted); background: rgba(31,111,74,0.05); border-radius: 0 8px 8px 0; }
    .md-content a { color: var(--brand); }
    .md-content hr { border: none; border-top: 1px solid var(--line); margin: 22px 0; }
    .md-content ul, .md-content ol { padding-left: 22px; margin: 0 0 10px; }
    .md-content li { margin: 4px 0; }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .error-banner { background: rgba(186,26,26,0.08); border: 1px solid rgba(186,26,26,0.2); border-radius: 12px; padding: 14px 18px; color: #7c1010; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="menu" aria-label="Navigation menu">
      <h2 class="menu-title">DL for CV</h2>
      <p class="menu-subtitle">GitHub Landing Navigation</p>
      <button id="home-btn" class="menu-button active" type="button">Home</button>
      <div id="nav-pages"></div>
    </aside>

    <main id="content" class="content" aria-live="polite"></main>
  </div>

  <script src="assignment_1/docs/content.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <script>
    marked.use({ breaks: true, gfm: true });

    const navPages  = document.getElementById("nav-pages");
    const homeBtn   = document.getElementById("home-btn");
    const contentEl = document.getElementById("content");

    // Build sidebar nav buttons from CONTENT.pages metadata
    CONTENT.pages.forEach(page => {
      const btn = document.createElement("button");
      btn.className   = "menu-button";
      btn.type        = "button";
      btn.dataset.id  = page.id;
      btn.textContent = page.title;
      btn.addEventListener("click", () => navigate(page.id));
      navPages.appendChild(btn);
    });

    function setActive(pageId) {
      homeBtn.classList.toggle("active", pageId === null);
      navPages.querySelectorAll(".menu-button").forEach(btn =>
        btn.classList.toggle("active", btn.dataset.id === pageId)
      );
    }

    function navigate(pageId) {
      setActive(pageId);
      if (pageId === null) { renderHome(); return; }
      const page = CONTENT.pages.find(p => p.id === pageId);
      if (page) renderPage(page);
    }

    function esc(text) {
      return String(text)
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    }

    function buildLinks(links) {
      if (!links || !links.length) return "";
      const items = links.map(l =>
        `<a class="report-link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)}</a>`
      ).join("");
      return `<div class="resource-links">${items}</div>`;
    }

    // Rewrite relative image paths in markdown text to include the section base path
    function rebaseImages(md, basePath) {
      md = md.replace(/!\[([^\]]*)\]\((?!https?:\/\/)([^)]+)\)/g,
        (_, alt, src) => `![${alt}](${basePath}/${src})`);
      md = md.replace(/(<img\b[^>]*?)src="(?!https?:\/\/|\/|data:)([^"]+)"/g,
        (_, pre, src) => `${pre}src="${basePath}/${src}"`);
      return md;
    }

    function renderHome() {
      const { group, supervisor, members } = CONTENT.site;
      const membersHTML = members.map(m => `<li>${esc(m)}</li>`).join("");
      contentEl.innerHTML = `
        <span class="eyebrow">Home</span>
        <h1>${esc(group)} — DL for Computer Vision</h1>
        <p class="lead">Welcome to the Group13 landing page. Use the sidebar to view detailed reports for each section.</p>
        <div class="card-grid">
          <article class="card"><h3>Group</h3><p>${esc(group)}</p></article>
          <article class="card"><h3>Supervisor</h3><p>${esc(supervisor)}</p></article>
        </div>
        <h2 class="section-title">Members</h2>
        <ul>${membersHTML}</ul>`;
    }

    async function renderPage(page) {
      const loadingEl = document.createElement("div");
      loadingEl.className   = "loading";
      loadingEl.textContent = "Loading report\u2026";
      contentEl.innerHTML = `
        <span class="eyebrow">${esc(page.title)}</span>
        <h1>${esc(page.subtitle)}</h1>
        ${buildLinks(page.links)}`;
      contentEl.appendChild(loadingEl);
      try {
        const resp = await fetch(page.readmePath);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        let md = await resp.text();
        md = rebaseImages(md, page.basePath);
        const mdEl = document.createElement("div");
        mdEl.className = "md-content";
        mdEl.innerHTML = marked.parse(md);
        loadingEl.replaceWith(mdEl);
      } catch (err) {
        const errEl = document.createElement("div");
        errEl.className   = "error-banner";
        errEl.textContent = `Could not load report: ${err}`;
        loadingEl.replaceWith(errEl);
      }
    }

    homeBtn.addEventListener("click", () => navigate(null));
    navigate(null);
  </script>
</body>
</html>
